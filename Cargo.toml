[package]
name = "healthcheck"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
reqwest = { version = "0.13.1", features=["rustls", "json"]}
tokio = { version = "1.49.0", features=["full"] }
tracing-subscriber = "0.3.22"
tracing = "0.1.44"
futures = "0.3.31"
serde_yaml = "0.9"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0.100"
axum = "0.8.8"
rust-embed = "8"
tokio-util = "0.7.14"
chrono = { version = "0.4.39", features = ["serde"] }
x509-parser = "0.16"
clap = { version = "4.5", features = ["derive"] }
rustls = { version = "0.23.36", features = ["ring"] }
rustls-native-certs = "0.8"
tokio-rustls = "0.26.4"
webpki-roots = "1.0.6"
rmcp = { version = "3.5.1", default-features = false, features = ["server", "macros", "transport-streamable-http-server"] }
schemars = "1.0"

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

# The binary ships to a flash-constrained router: drop symbols, thin LTO keeps build time sane.
[profile.release]
strip = true
lto = "thin"
